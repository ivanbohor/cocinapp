<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="250" height="250">
  <!-- Fondo redondeado naranja -->
  <rect width="100" height="100" rx="24" fill="#FF7200"/>
  
  <!-- Icono del gorro de chef -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Contorno principal y pliegues del gorro -->
    <path d="M 28 72 
             V 52 
             C 8 52, 8 32, 28 32 
             C 28 8, 72 8, 72 32 
             C 92 32, 92 52, 72 52 
             V 72 
             Q 50 80 28 72 Z" />
    
    <!-- Borde inferior para dar efecto de apertura y volumen -->
    <path d="M 28 72 Q 50 64 72 72" />
    
    <!-- Detalle de la línea horizontal central -->
    <path d="M 41 61 L 59 61" />
    
  </g>
</svg>
